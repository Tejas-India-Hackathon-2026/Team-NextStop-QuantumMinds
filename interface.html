<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Smart Transaction</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#dbeafe;
}

.container{
    width:800px;
    max-width:90%;
    margin:60px auto;
}

.title{
    text-align:center;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px #93c5fd;
}

.amount{
    font-size:30px;
    width:100%;
    border:0;
    border-bottom:2px solid #2563eb;
    padding:15px;
}

.signal{
    padding:12px;
    margin:8px;
    background:#eff6ff;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>💳 SecureFlow AI</h1>

<p>Smart Transaction Protection</p>

</div>

<div class="cards">

<div class="card">

<h2>Payment</h2>

<input class="amount"
id="amount"
type="number"
placeholder="₹ Amount">

<h3>Security Signals</h3>

<div class="signal">
<input id="unusual_time" type="checkbox">
Unusual Time
</div>

<div class="signal">
<input id="unusual_frequency" type="checkbox">
Unusual Frequency
</div>

<div class="signal">
<input id="new_device" type="checkbox">
New Device
</div>

<div class="signal">
<input id="unusual_location" type="checkbox">
Unusual Location
</div>

<div class="signal">
<input id="sudden_location_change" type="checkbox">
Sudden Location Change
</div>

<div class="signal">
<input id="unknown_beneficiary" type="checkbox">
Unknown Beneficiary
</div>

<div class="signal">
<input id="no_previous_transactions" type="checkbox">
No Previous Transaction
</div>

<div class="signal">
<input id="unusual_beneficiary_amount" type="checkbox">
Unusual Amount
</div>

<button onclick="check()">
CHECK SECURITY
</button>

</div>

<div class="card">

<h2>Security Result</h2>

<h1 id="score">--</h1>

<h2 id="decision">Waiting</h2>

<h3>Risk Factors</h3>

<ul id="reasons"></ul>

<h3>Questions</h3>

<ul id="questions"></ul>

</div>

</div>

</div>

<script>

async function check(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("score").innerText=
"Risk: "+r.risk_score;

document.getElementById("decision").innerText=
r.decision;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<li>${x}</li>`).join("");

document.getElementById("questions").innerHTML=
r.ai_questions.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
