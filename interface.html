<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>SecureFlow Admin</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f8fafc;
}

.sidebar{
    position:fixed;
    width:220px;
    height:100vh;
    background:#172554;
    color:white;
    padding:25px;
}

.main{
    margin-left:270px;
    padding:35px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px #ddd;
}

.stats{
    display:flex;
    gap:20px;
}

.stat{
    flex:1;
    padding:25px;
    background:white;
    border-radius:12px;
}

input[type=number]{
    width:100%;
    padding:15px;
    margin:15px 0;
}

label{
    display:block;
    padding:10px;
}

button{
    padding:15px;
    width:100%;
    background:#1d4ed8;
    color:white;
    border:0;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>SecureFlow</h2>

<p>Dashboard</p>
<p>Transactions</p>
<p>Fraud Monitor</p>
<p>AI Analysis</p>
<p>Security Logs</p>

</div>

<div class="main">

<h1>Fraud Monitoring Dashboard</h1>

<div class="stats">

<div class="stat">
<h3>Risk Score</h3>
<h1 id="score">--</h1>
</div>

<div class="stat">
<h3>Decision</h3>
<h1 id="decision">--</h1>
</div>

</div>

<br>

<div class="card">

<h2>Analyze Transaction</h2>

<input id="amount" type="number" placeholder="Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="analyze()">RUN ANALYSIS</button>

<h3>Reasons</h3>
<ul id="reasons"></ul>

</div>

</div>

<script>

async function analyze(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("score").innerText=r.risk_score;
document.getElementById("decision").innerText=r.decision;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
