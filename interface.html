<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>SecureFlow</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:white;
    color:#111;
}

.container{
    width:600px;
    max-width:90%;
    margin:70px auto;
}

h1{
    font-size:42px;
}

.subtitle{
    color:#64748b;
}

input[type=number]{
    width:100%;
    padding:18px;
    border:1px solid #ddd;
    border-radius:5px;
    font-size:20px;
}

.option{
    border-bottom:1px solid #eee;
    padding:15px 0;
}

button{
    margin-top:25px;
    width:100%;
    padding:18px;
    background:#111;
    color:white;
    border:0;
    font-size:16px;
}

.result{
    margin-top:30px;
    border-top:3px solid #111;
    padding-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>SecureFlow AI</h1>

<p class="subtitle">
Simple UPI Fraud Detection
</p>

<input id="amount"
type="number"
placeholder="Transaction Amount">

<div class="option">
<input id="unusual_time" type="checkbox">
Unusual Time
</div>

<div class="option">
<input id="unusual_frequency" type="checkbox">
Unusual Frequency
</div>

<div class="option">
<input id="new_device" type="checkbox">
New Device
</div>

<div class="option">
<input id="unusual_location" type="checkbox">
Unusual Location
</div>

<div class="option">
<input id="sudden_location_change" type="checkbox">
Sudden Location Change
</div>

<div class="option">
<input id="unknown_beneficiary" type="checkbox">
Unknown Beneficiary
</div>

<div class="option">
<input id="no_previous_transactions" type="checkbox">
No Previous Transactions
</div>

<div class="option">
<input id="unusual_beneficiary_amount" type="checkbox">
Unusual Beneficiary Amount
</div>

<button onclick="analyze()">
CHECK TRANSACTION
</button>

<div class="result" id="result">
Result will appear here.
</div>

</div>

<script>

async function analyze(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("result").innerHTML=`
<h2>Risk Score: ${r.risk_score}</h2>
<h2>${r.decision}</h2>
<p>${r.reasons.join(", ")}</p>
`;

}

</script>

</body>
</html>
