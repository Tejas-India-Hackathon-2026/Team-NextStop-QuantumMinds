<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>FraudBot AI</title>

<style>

body{
    margin:0;
    background:#020617;
    color:#e2e8f0;
    font-family:Arial;
}

header{
    text-align:center;
    padding:30px;
}

.robot{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    box-shadow:0 0 40px #2563eb;
}

.chat{
    width:650px;
    max-width:90%;
    margin:auto;
    background:#0f172a;
    padding:25px;
    border-radius:20px;
}

.message{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin:10px 0;
}

input{
    width:100%;
    padding:15px;
    box-sizing:border-box;
    background:#1e293b;
    border:1px solid #475569;
    color:white;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
}

</style>
</head>

<body>

<header>

<div class="robot">🤖</div>

<h1>FraudBot AI</h1>

<p>Your intelligent UPI transaction security assistant</p>

</header>

<div class="chat">

<div class="message">
🤖 Enter the transaction amount to begin security analysis.
</div>

<input id="amount" type="number" placeholder="Transaction amount ₹">

<h3>Security Signals</h3>

<label><input id="unusual_time" type="checkbox"> Unusual Time</label><br>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label><br>
<label><input id="new_device" type="checkbox"> New Device</label><br>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label><br>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label><br>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label><br>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transactions</label><br>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Beneficiary Amount</label>

<button onclick="askAI()">ASK FRAUDBOT AI</button>

<div id="result"></div>

</div>

<script>

async function askAI(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("result").innerHTML=`

<div class="message">
🤖 Risk Score: <b>${r.risk_score}</b>
</div>

<div class="message">
🤖 Decision: <b>${r.decision}</b>
</div>

<div class="message">
🤖 Detected Factors:
<ul>
${r.reasons.map(x=>`<li>${x}</li>`).join("")}
</ul>
</div>

<div class="message">
🤖 Verification Questions:
<ul>
${r.ai_questions.map(x=>`<li>${x}</li>`).join("")}
</ul>
</div>

`;

}

</script>

</body>
</html>
