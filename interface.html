<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Fraud Alert Center</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial;
}

.header{
    background:#991b1b;
    padding:25px;
    text-align:center;
}

.container{
    max-width:850px;
    margin:40px auto;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
}

input[type=number]{
    width:100%;
    padding:15px;
    background:#374151;
    color:white;
    border:0;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
}

label{
    padding:15px;
}

button{
    width:100%;
    padding:16px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:8px;
    font-size:17px;
}

.alert{
    margin-top:25px;
    padding:25px;
    background:#450a0a;
    border:1px solid #ef4444;
    border-radius:12px;
}

.score{
    font-size:60px;
    text-align:center;
}

</style>
</head>

<body>

<div class="header">

<h1>🚨 FRAUD ALERT CENTER</h1>

<p>SecureFlow AI Transaction Monitoring</p>

</div>

<div class="container">

<h2>Transaction Information</h2>

<input id="amount" type="number" placeholder="Enter transaction amount">

<div class="grid">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

</div>

<button onclick="detect()">DETECT FRAUD</button>

<div class="alert">

<div class="score" id="score">--</div>

<h2 id="decision">System Ready</h2>

<h3>Detected Problems</h3>

<ul id="reasons"></ul>

</div>

</div>

<script>

async function detect(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await response.json();

document.getElementById("score").innerText=result.risk_score;

document.getElementById("decision").innerText=
result.decision;

document.getElementById("reasons").innerHTML=
result.reasons.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
