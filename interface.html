<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberShield AI</title>

<style>
body{
    margin:0;
    background:#000;
    color:#00ff88;
    font-family:monospace;
}

header{
    padding:25px;
    border-bottom:1px solid #00ff88;
    text-align:center;
}

.dashboard{
    width:900px;
    max-width:90%;
    margin:40px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.panel{
    border:1px solid #00ff88;
    padding:25px;
    background:#03140c;
    box-shadow:0 0 20px rgba(0,255,100,.2);
}

input[type=number]{
    width:100%;
    padding:15px;
    background:#000;
    color:#00ff88;
    border:1px solid #00ff88;
    margin:15px 0;
}

label{
    display:block;
    padding:10px;
}

button{
    width:100%;
    padding:15px;
    background:#00ff88;
    color:#000;
    font-weight:bold;
    border:0;
    cursor:pointer;
}

.score{
    font-size:70px;
    text-align:center;
}
</style>
</head>

<body>

<header>
<h1>⚡ CYBERSHIELD AI</h1>
<p>UPI FRAUD DETECTION TERMINAL</p>
</header>

<div class="dashboard">

<div class="panel">

<h2>> TRANSACTION_INPUT</h2>

<input id="amount" type="number" placeholder="AMOUNT">

<label><input id="unusual_time" type="checkbox"> TIME_ANOMALY</label>
<label><input id="unusual_frequency" type="checkbox"> FREQUENCY_ANOMALY</label>
<label><input id="new_device" type="checkbox"> NEW_DEVICE</label>
<label><input id="unusual_location" type="checkbox"> LOCATION_ANOMALY</label>
<label><input id="sudden_location_change" type="checkbox"> LOCATION_CHANGE</label>
<label><input id="unknown_beneficiary" type="checkbox"> UNKNOWN_RECIPIENT</label>
<label><input id="no_previous_transactions" type="checkbox"> FIRST_TRANSACTION</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> AMOUNT_ANOMALY</label>

<button onclick="scan()">[ RUN SECURITY SCAN ]</button>

</div>

<div class="panel">

<h2>> SYSTEM_RESULT</h2>

<div class="score" id="score">0</div>

<h2 id="decision">SYSTEM READY</h2>

<p>THREATS:</p>

<ul id="reasons"></ul>

<p>AI_QUERY:</p>

<ul id="questions"></ul>

</div>

</div>

<script>

async function scan(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const r=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await r.json();

document.getElementById("score").innerText=result.risk_score;
document.getElementById("decision").innerText=
"DECISION: "+result.decision;

document.getElementById("reasons").innerHTML=
result.reasons.map(x=>`<li>${x}</li>`).join("");

document.getElementById("questions").innerHTML=
result.ai_questions.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
