<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure UPI</title>

<style>

body{
    margin:0;
    background:#f1f5f9;
    font-family:Arial;
}

.phone{
    width:390px;
    max-width:94%;
    margin:30px auto;
    background:white;
    min-height:700px;
    border-radius:30px;
    padding:25px;
    box-shadow:0 10px 30px #aaa;
}

.logo{
    text-align:center;
    color:#673ab7;
    font-size:28px;
    font-weight:bold;
}

.recipient{
    text-align:center;
    margin:30px 0;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#673ab7;
    color:white;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.amount input{
    width:100%;
    border:0;
    text-align:center;
    font-size:40px;
    outline:none;
}

.security{
    background:#f8fafc;
    padding:15px;
    border-radius:15px;
}

label{
    display:block;
    padding:10px;
}

button{
    width:100%;
    padding:17px;
    border:0;
    border-radius:12px;
    background:#673ab7;
    color:white;
    font-size:17px;
    margin-top:20px;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f3e8ff;
    border-radius:12px;
}

</style>
</head>

<body>

<div class="phone">

<div class="logo">SecureFlow</div>

<div class="recipient">

<div class="avatar">R</div>

<h3>UPI Payment</h3>

<p>Secure Transaction Check</p>

</div>

<div class="amount">

<input id="amount" type="number" placeholder="₹0">

</div>

<div class="security">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Frequent Payment</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> New Location</label>
<label><input id="sudden_location_change" type="checkbox"> Travel Detected</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Recipient</label>
<label><input id="no_previous_transactions" type="checkbox"> First Payment</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

</div>

<button onclick="verify()">VERIFY & PAY</button>

<div id="result">Waiting for verification...</div>

</div>

<script>

async function verify(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("result").innerHTML=`
<h2>${r.decision}</h2>
<p>Risk Score: ${r.risk_score}</p>
<ul>${r.reasons.map(x=>`<li>${x}</li>`).join("")}</ul>
`;

}

</script>

</body>
</html>
