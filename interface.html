<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>SecureFlow Cyber</title>

<style>

body{
    margin:0;
    background:#090014;
    color:#00ffff;
    font-family:Arial;
}

.container{
    width:850px;
    max-width:90%;
    margin:50px auto;
}

.box{
    border:2px solid #00ffff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 25px #00ffff;
}

input[type=number]{
    width:100%;
    padding:15px;
    background:#090014;
    color:#00ffff;
    border:1px solid #ff00ff;
}

label{
    display:block;
    padding:12px;
}

button{
    width:100%;
    padding:15px;
    background:#ff00ff;
    color:white;
    border:0;
    font-weight:bold;
    margin-top:20px;
}

.score{
    text-align:center;
    font-size:80px;
    color:#ff00ff;
    text-shadow:0 0 20px #ff00ff;
}

</style>

</head>

<body>

<div class="container">

<div class="box">

<h1>⚡ SECUREFLOW // AI</h1>

<p>TRANSACTION SECURITY NETWORK</p>

<input id="amount"
type="number"
placeholder="₹ TRANSACTION AMOUNT">

<label><input id="unusual_time" type="checkbox"> TIME_ANOMALY</label>
<label><input id="unusual_frequency" type="checkbox"> FREQUENCY_ANOMALY</label>
<label><input id="new_device" type="checkbox"> DEVICE_ANOMALY</label>
<label><input id="unusual_location" type="checkbox"> LOCATION_ANOMALY</label>
<label><input id="sudden_location_change" type="checkbox"> LOCATION_SHIFT</label>
<label><input id="unknown_beneficiary" type="checkbox"> UNKNOWN_BENEFICIARY</label>
<label><input id="no_previous_transactions" type="checkbox"> NEW_BENEFICIARY</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> AMOUNT_ANOMALY</label>

<button onclick="scan()">INITIATE AI SCAN</button>

<div class="score" id="score">00</div>

<h2 id="decision">SYSTEM STANDBY</h2>

<ul id="reasons"></ul>

</div>

</div>

<script>

async function scan(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("score").innerText=r.risk_score;
document.getElementById("decision").innerText=r.decision;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
