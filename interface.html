<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFlow AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#312e81,#4c1d95);
    color:white;
}

.container{
    width:900px;
    max-width:95%;
    margin:50px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
}

h1{text-align:center}

input[type=number]{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    margin:15px 0;
    font-size:18px;
}

label{
    display:block;
    padding:12px;
    margin:7px 0;
    background:rgba(255,255,255,.1);
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:#8b5cf6;
    color:white;
    font-size:17px;
}

.score{
    font-size:70px;
    text-align:center;
    margin:30px;
}
</style>
</head>

<body>

<h1>🛡 SecureFlow AI</h1>

<div class="container">

<div class="card">

<h2>Transaction Scanner</h2>

<input id="amount" type="number" placeholder="Enter Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transactions</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Beneficiary Amount</label>

<button onclick="analyze()">SCAN TRANSACTION</button>

</div>

<div class="card">

<h2>AI Risk Analysis</h2>

<div class="score" id="score">--</div>

<h2 id="decision">Waiting...</h2>

<h3>Risk Factors</h3>
<ul id="reasons"></ul>

<h3>AI Questions</h3>
<ul id="questions"></ul>

</div>

</div>

<script>

async function analyze(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await response.json();

document.getElementById("score").innerText=result.risk_score;
document.getElementById("decision").innerText=result.decision;

document.getElementById("reasons").innerHTML=
result.reasons.map(x=>`<li>${x}</li>`).join("");

document.getElementById("questions").innerHTML=
result.ai_questions.map(x=>`<li>${x}</li>`).join("");

}

</script>

</body>
</html>
