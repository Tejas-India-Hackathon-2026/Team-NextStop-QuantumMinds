<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFlow-AI | Fraud Statistics</title>

<link rel="stylesheet" href="style10.css">

</head>

<body>

<main class="main">

<header class="header">

<div>
<h1>Fraud Statistics</h1>
<p>Security statistics generated from transaction activity</p>
</div>

<div class="avatar">FS</div>

</header>


<section class="stats">

<div class="stat">
<div class="stat-title">TRANSACTIONS</div>
<div class="stat-number blue">40</div>
</div>

<div class="stat">
<div class="stat-title">FRAUD ALERTS</div>
<div class="stat-number red">12</div>
</div>

<div class="stat">
<div class="stat-title">BLOCKED</div>
<div class="stat-number red">10</div>
</div>

<div class="stat">
<div class="stat-title">SAFE</div>
<div class="stat-number green">18</div>
</div>

</section>


<section class="panel factors">

<div class="panel-title">

<h2>Fraud Categories</h2>

<p>Distribution of detected suspicious behaviour</p>

</div>


<div class="factor-grid">

<div class="factor">

<h3>Unusual Amount</h3>

<p>18 cases</p>

<div class="progress">
<div style="width:90%"></div>
</div>

</div>

<div class="factor">

<h3>Unknown Recipient</h3>

<p>14 cases</p>

<div class="progress">
<div style="width:75%"></div>
</div>

</div>

<div class="factor">

<h3>New Device</h3>

<p>09 cases</p>

<div class="progress">
<div style="width:55%"></div>
</div>

</div>

<div class="factor">

<h3>Location Anomaly</h3>

<p>07 cases</p>

<div class="progress">
<div style="width:45%"></div>
</div>

</div>

</div>

</section>

</main>

</body>
</html>
