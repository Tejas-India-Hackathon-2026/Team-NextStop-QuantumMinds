<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureFlow-AI | User Risk</title>

    <link rel="stylesheet" href="style10.css">
</head>

<body>

<main class="main">

<header class="header">

    <div>
        <h1>User Risk Profiles</h1>
        <p>Behavioural risk assessment of users</p>
    </div>

    <div class="avatar">U</div>

</header>

<section class="panel factors">

    <div class="panel-title">
        <h2>User Risk Analysis</h2>
        <p>AI-generated user risk profiles</p>
    </div>

    <table>

        <thead>

            <tr>
                <th>User</th>
                <th>Transactions</th>
                <th>Average Amount</th>
                <th>Risk Score</th>
                <th>Risk Level</th>
                <th>Monitoring</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>Rahul Sharma</td>
                <td>12</td>
                <td>₹2,400</td>
                <td>15</td>
                <td>
                    <span class="badge safe">LOW</span>
                </td>
                <td>Normal</td>
            </tr>

            <tr>
                <td>Rohan Gupta</td>
                <td>08</td>
                <td>₹9,800</td>
                <td>67</td>
                <td>
                    <span class="badge review">MEDIUM</span>
                </td>
                <td>Monitor</td>
            </tr>

            <tr>
                <td>Amit Kumar</td>
                <td>06</td>
                <td>₹31,500</td>
                <td>91</td>
                <td>
                    <span class="badge high">HIGH</span>
                </td>
                <td>Restricted</td>
            </tr>

        </tbody>

    </table>

</section>

</main>

</body>
</html>
