<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SecureFlow-AI | System Monitor</title>

<link rel="stylesheet"
href="style10.css">

</head>


<body>

<main class="main">


<header class="header">

<div>

<h1>System Health Monitor</h1>

<p>
SecureFlow-AI infrastructure and AI engine status
</p>

</div>

</header>


<section class="stats">


<div class="stat">

<div class="stat-title">
AI ENGINE
</div>

<div class="stat-number green">
ONLINE
</div>

</div>


<div class="stat">

<div class="stat-title">
DATABASE
</div>

<div class="stat-number green">
ONLINE
</div>

</div>


<div class="stat">

<div class="stat-title">
API
</div>

<div class="stat-number green">
ONLINE
</div>

</div>


<div class="stat">

<div class="stat-title">
UPTIME
</div>

<div class="stat-number blue">
99.9%
</div>

</div>


</section>


<section class="panel factors">


<div class="panel-title">

<h2>
System Components
</h2>

<p>
Current operational status
</p>

</div>


<div class="factor-grid">


<div class="factor">

<h3>
FastAPI Backend
</h3>

<p>
Operational
</p>

<div class="progress">

<div style="width:100%"></div>

</div>

</div>


<div class="factor">

<h3>
SQLite Database
</h3>

<p>
Connected
</p>

<div class="progress">

<div style="width:100%"></div>

</div>

</div>


<div class="factor">

<h3>
Fraud Engine
</h3>

<p>
Monitoring
</p>

<div class="progress">

<div style="width:98%"></div>

</div>

</div>


<div class="factor">

<h3>
Alert System
</h3>

<p>
Operational
</p>

<div class="progress">

<div style="width:99%"></div>

</div>

</div>


</div>

</section>


</main>

</body>

</html>
