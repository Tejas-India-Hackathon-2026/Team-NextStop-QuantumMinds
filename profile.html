<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction History Analyzer</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f8fafc;
}

header{
background:#1e293b;
color:white;
padding:25px;
}

.container{
max-width:900px;
margin:30px auto;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #cbd5e1;
}

.transaction{
display:flex;
justify-content:space-between;
padding:18px;
border-bottom:1px solid #e2e8f0;
}

.safe{
color:#16a34a;
}

.warning{
color:#ca8a04;
}

.danger{
color:#dc2626;
}

button{
padding:14px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
width:100%;
margin-top:20px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}
</style>
</head>

<body>

<header>

<h1>💳 UPI Transaction History</h1>
<p>SecureFlow-AI Historical Risk Analyzer</p>

</header>

<div class="container">

<div class="card">

<h2>Current Transaction</h2>

<input id="amount" type="number"
placeholder="Transaction Amount ₹">

<br><br>

<label>
<input id="unusual_time" type="checkbox">
 Unusual Time
</label>

<br>

<label>
<input id="unusual_frequency" type="checkbox">
 Unusual Frequency
</label>

<br>

<label>
<input id="new_device" type="checkbox">
 New Device
</label>

<br>

<label>
<input id="unusual_location" type="checkbox">
 Unusual Location
</label>

<br>

<label>
<input id="sudden_location_change" type="checkbox">
 Sudden Location Change
</label>

<br>

<label>
<input id="unknown_beneficiary" type="checkbox">
 Unknown Beneficiary
</label>

<br>

<label>
<input id="no_previous_transactions" type="checkbox">
 No Previous Transaction
</label>

<br>

<label>
<input id="unusual_beneficiary_amount" type="checkbox">
 Unusual Beneficiary Amount
</label>

<button onclick="analyze()">ANALYZE HISTORY</button>

</div>

<div class="card" style="margin-top:20px">

<h2>Transaction Risk History</h2>

<div class="transaction">
<span>Current Transaction</span>
<strong id="decision">Waiting</strong>
</div>

<div class="transaction">
<span>Risk Score</span>
<strong id="score">--</strong>
</div>

<div class="transaction">
<span>Risk Indicators</span>
<strong id="count">0</strong>
</div>

<div id="reasons"></div>

</div>

</div>

<script>

async function analyze(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("decision").innerText=r.decision;

document.getElementById("score").innerText=r.risk_score;

document.getElementById("count").innerText=
r.reasons.length;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>
`<div class="transaction">
<span>⚠ ${x}</span>
</div>`
).join("");
}

</script>

</body>
</html>
