<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Device Security Monitor</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111827;
color:white;
}

header{
padding:25px;
background:#030712;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#1f2937;
padding:25px;
border-radius:15px;
}

.icon{
font-size:50px;
text-align:center;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
background:#111827;
color:white;
border:1px solid #4b5563;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#7c3aed;
color:white;
border:0;
border-radius:8px;
margin-top:15px;
}

.result{
grid-column:1/3;
text-align:center;
}
</style>
</head>

<body>

<header>
<h1>📱 Device & Location Security</h1>
<p>SecureFlow-AI UPI Fraud Detection</p>
</header>

<div class="container">

<div class="grid">

<div class="card">

<div class="icon">📱</div>

<h2>Device Analysis</h2>

<label>
<input id="new_device" type="checkbox">
 New Device
</label>

<label>
<input id="unusual_frequency" type="checkbox">
 Unusual Transaction Frequency
</label>

</div>

<div class="card">

<div class="icon">📍</div>

<h2>Location Analysis</h2>

<label>
<input id="unusual_location" type="checkbox">
 Unusual Location
</label>

<label>
<input id="sudden_location_change" type="checkbox">
 Sudden Location Change
</label>

</div>

<div class="card">

<h2>Transaction Analysis</h2>

<input id="amount" type="number"
placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="analyze()">ANALYZE DEVICE & LOCATION</button>

</div>

<div class="card result">

<h1 id="score">--</h1>
<h2 id="decision">SYSTEM READY</h2>

<div id="reasons"></div>

</div>

</div>
</div>

<script>

async function analyze(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("score").innerText=
"Risk "+r.risk_score;

document.getElementById("decision").innerText=
r.decision;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}

</script>

</body>
</html>
