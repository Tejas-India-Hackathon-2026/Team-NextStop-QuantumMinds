<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Verification</title>

<style>
body{
margin:0;
font-family:Arial;
background:#eef2ff;
}

.container{
width:700px;
max-width:90%;
margin:40px auto;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px #c7d2fe;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#4f46e5;
color:white;
border:0;
border-radius:8px;
}

.question{
background:#eef2ff;
padding:18px;
margin:12px 0;
border-radius:12px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🤖 SecureFlow AI</h1>

<h2>Transaction Verification Interview</h2>

<input id="amount" type="number"
placeholder="Payment Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="askAI()">GENERATE AI QUESTIONS</button>

<div id="result"></div>

</div>
</div>

<script>

async function askAI(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("result").innerHTML=`

<h2>Risk Score: ${r.risk_score}</h2>

<h2>Decision: ${r.decision}</h2>

<h3>AI Verification Questions</h3>

${r.ai_questions.map(q=>
`<div class="question">🤖 ${q}</div>`
).join("")}

`;
}

</script>

</body>
</html>
