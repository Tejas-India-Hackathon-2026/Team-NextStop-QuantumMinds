<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beneficiary Security</title>

<style>
body{
margin:0;
font-family:Arial;
background:#ecfdf5;
}

.container{
width:600px;
max-width:90%;
margin:50px auto;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 30px #a7f3d0;
}

.receiver{
text-align:center;
padding:25px;
background:#f0fdf4;
border-radius:15px;
}

.avatar{
width:80px;
height:80px;
background:#059669;
color:white;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
margin:15px 0;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#059669;
color:white;
border:0;
border-radius:8px;
}

.result{
text-align:center;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="receiver">

<div class="avatar">₹</div>

<h2>UPI Beneficiary</h2>
<p>Recipient Security Verification</p>

</div>

<input id="amount" type="number"
placeholder="Payment Amount ₹">

<label>
<input id="unusual_time" type="checkbox">
 Unusual Time
</label>

<label>
<input id="unusual_frequency" type="checkbox">
 Unusual Frequency
</label>

<label>
<input id="new_device" type="checkbox">
 New Device
</label>

<label>
<input id="unusual_location" type="checkbox">
 Unusual Location
</label>

<label>
<input id="sudden_location_change" type="checkbox">
 Sudden Location Change
</label>

<label>
<input id="unknown_beneficiary" type="checkbox">
 Unknown Beneficiary
</label>

<label>
<input id="no_previous_transactions" type="checkbox">
 No Previous Transaction
</label>

<label>
<input id="unusual_beneficiary_amount" type="checkbox">
 Unusual Beneficiary Amount
</label>

<button onclick="verifyBeneficiary()">
VERIFY BENEFICIARY
</button>

<div class="result">

<h2 id="decision">Beneficiary Not Verified</h2>

<h3 id="score"></h3>

<div id="reasons"></div>

</div>

</div>
</div>

<script>

async function verifyBeneficiary(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("decision").innerText=
r.decision;

document.getElementById("score").innerText=
"Risk Score: "+r.risk_score;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}

</script>

</body>
</html>
