<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Control Room</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#e2e8f0;
}

header{
background:#111827;
padding:20px;
border-bottom:1px solid #334155;
}

.dashboard{
max-width:1100px;
margin:30px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.panel{
background:#111827;
border:1px solid #334155;
padding:25px;
border-radius:15px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
background:#020617;
color:white;
border:1px solid #475569;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#7c3aed;
color:white;
border:0;
border-radius:8px;
margin-top:15px;
}

.score{
font-size:70px;
text-align:center;
}

.log{
background:#020617;
padding:20px;
margin-top:20px;
font-family:monospace;
min-height:150px;
}

</style>
</head>

<body>

<header>
<h1>🖥 SecureFlow-AI Fraud Control Room</h1>
</header>

<div class="dashboard">

<div class="panel">

<h2>Transaction Input</h2>

<input id="amount" type="number"
placeholder="UPI Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transactions</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="run()">RUN DETECTION ENGINE</button>

</div>

<div class="panel">

<h2>Risk Monitor</h2>

<div class="score" id="score">0</div>

<h2 id="decision" style="text-align:center">
SYSTEM READY
</h2>

<div class="log" id="log">
Waiting for transaction...
</div>

</div>

</div>

<script>

async function run(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("score").innerText=r.risk_score;

document.getElementById("decision").innerText=r.decision;

document.getElementById("log").innerHTML=
r.reasons.map(x=>"⚠ "+x+"<br>").join("");
}

</script>

</body>
</html>
