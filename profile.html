<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Risk Gauge</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
text-align:center;
}

.container{
width:700px;
max-width:90%;
margin:40px auto;
}

.gauge{
width:300px;
height:150px;
border-radius:300px 300px 0 0;
background:linear-gradient(
90deg,
#22c55e,
#facc15,
#ef4444
);
margin:30px auto;
position:relative;
}

.needle{
width:6px;
height:130px;
background:white;
position:absolute;
bottom:0;
left:50%;
transform-origin:bottom;
transform:rotate(-90deg);
transition:1s;
}

.value{
font-size:50px;
font-weight:bold;
}

.panel{
background:#111827;
padding:25px;
border-radius:15px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
background:#020617;
color:white;
border:1px solid #475569;
}

label{
display:block;
text-align:left;
padding:7px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 AI Fraud Risk Gauge</h1>

<div class="gauge">
<div class="needle" id="needle"></div>
</div>

<div class="value" id="score">0</div>

<h2 id="decision">READY</h2>

<div class="panel">

<input id="amount" type="number"
placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transactions</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="checkRisk()">CHECK RISK</button>

<div id="reasons"></div>

</div>
</div>

<script>

async function checkRisk(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("score").innerText=r.risk_score;
document.getElementById("decision").innerText=r.decision;

let rotation=-90+(r.risk_score/100)*180;

document.getElementById("needle").style.transform=
`rotate(${rotation}deg)`;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}

</script>

</body>
</html>
