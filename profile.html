<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Decision Center</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:20px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
background:#0f172a;
border:1px solid #475569;
color:white;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#06b6d4;
border:0;
color:white;
border-radius:8px;
}

.decision{
text-align:center;
font-size:45px;
margin:25px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>⚖ UPI Fraud Decision Center</h1>

<p>SecureFlow-AI automated payment decision system</p>

<input id="amount" type="number"
placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Time anomaly</label>
<label><input id="unusual_frequency" type="checkbox"> Frequency anomaly</label>
<label><input id="new_device" type="checkbox"> Device anomaly</label>
<label><input id="unusual_location" type="checkbox"> Location anomaly</label>
<label><input id="sudden_location_change" type="checkbox"> Location movement</label>
<label><input id="unknown_beneficiary" type="checkbox"> Beneficiary anomaly</label>
<label><input id="no_previous_transactions" type="checkbox"> Transaction history anomaly</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Amount anomaly</label>

<button onclick="decide()">MAKE AI DECISION</button>

<div class="decision" id="decision">
WAITING
</div>

<h2 style="text-align:center" id="score"></h2>

<div id="reasons"></div>

</div>
</div>

<script>

async function decide(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

const r=await response.json();

document.getElementById("decision").innerText=r.decision;

document.getElementById("score").innerText=
"Risk Score: "+r.risk_score;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}

</script>

</body>
</html>
