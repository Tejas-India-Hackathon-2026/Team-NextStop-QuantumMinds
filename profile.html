<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Report</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e2e8f0;
}

.report{
width:750px;
max-width:90%;
margin:40px auto;
background:white;
padding:35px;
border-radius:10px;
}

.header{
border-bottom:3px solid #1e3a8a;
padding-bottom:20px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
margin:15px 0;
}

label{
display:block;
padding:7px;
}

button{
width:100%;
padding:15px;
background:#1e3a8a;
color:white;
border:0;
border-radius:8px;
}

.reportBox{
margin-top:25px;
border:1px solid #cbd5e1;
padding:20px;
}

</style>
</head>

<body>

<div class="report">

<div class="header">

<h1>SECUREFLOW-AI</h1>

<h2>UPI FRAUD ANALYSIS REPORT</h2>

</div>

<input id="amount" type="number"
placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="generateReport()">
GENERATE FRAUD REPORT
</button>

<div class="reportBox" id="report">

<h2>Report Pending</h2>

</div>

</div>

<script>

async function generateReport(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("report").innerHTML=`

<h2>Transaction Analysis</h2>

<p><b>Amount:</b> ₹${data.amount}</p>

<p><b>Risk Score:</b> ${r.risk_score}</p>

<p><b>AI Decision:</b> ${r.decision}</p>

<hr>

<h3>Detected Fraud Indicators</h3>

${r.reasons.map(x=>`<p>• ${x}</p>`).join("")}

<hr>

<h3>AI Verification Questions</h3>

${r.ai_questions.map(x=>`<p>🤖 ${x}</p>`).join("")}

`;

}

</script>

</body>
</html>
