<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPI Security Status</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f8fafc;
}

.container{
width:650px;
max-width:90%;
margin:40px auto;
}

.status{
background:#16a34a;
color:white;
padding:30px;
text-align:center;
border-radius:20px 20px 0 0;
}

.panel{
background:white;
padding:30px;
box-shadow:0 5px 20px #cbd5e1;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#16a34a;
color:white;
border:0;
border-radius:8px;
}

.score{
font-size:60px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="status">

<h1>● UPI SECURITY ACTIVE</h1>

<p>SecureFlow-AI Protection System</p>

</div>

<div class="panel">

<h2>Transaction Security Check</h2>

<input id="amount" type="number"
placeholder="Amount ₹">

<label><input id="unusual_time" type="checkbox"> Time Anomaly</label>
<label><input id="unusual_frequency" type="checkbox"> Frequency Anomaly</label>
<label><input id="new_device" type="checkbox"> Device Anomaly</label>
<label><input id="unusual_location" type="checkbox"> Location Anomaly</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transactions</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Amount Anomaly</label>

<button onclick="check()">CHECK SECURITY</button>

<div class="score" id="score">--</div>

<h2 style="text-align:center" id="decision">
SECURITY CHECK PENDING
</h2>

<div id="reasons"></div>

</div>
</div>

<script>

async function check(){

let ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

let r=await response.json();

document.getElementById("score").innerText=
r.risk_score;

document.getElementById("decision").innerText=
r.decision;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}

</script>

</body>
</html>
