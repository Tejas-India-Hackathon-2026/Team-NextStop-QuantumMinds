<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFlow-AI | Backup Status</title>

<link rel="stylesheet" href="style10.css">

</head>

<body>

<main class="main">

<header class="header">

<div>
<h1>Backup Status</h1>
<p>Database and security data backup monitoring</p>
</div>

<div class="avatar">BK</div>

</header>

<section class="stats">

<div class="stat">
<div class="stat-title">BACKUP STATUS</div>
<div class="stat-number green">SAFE</div>
</div>

<div class="stat">
<div class="stat-title">LAST BACKUP</div>
<div class="stat-number blue">12:00</div>
</div>

<div class="stat">
<div class="stat-title">DATABASE</div>
<div class="stat-number green">100%</div>
</div>

<div class="stat">
<div class="stat-title">ERRORS</div>
<div class="stat-number green">00</div>
</div>

</section>

<section class="panel factors">

<div class="panel-title">
<h2>Backup History</h2>
<p>Recent database backups</p>
</div>

<table>

<thead>

<tr>
<th>Backup ID</th>
<th>Date</th>
<th>Size</th>
<th>Records</th>
<th>Duration</th>
<th>Status</th>
</tr>

</thead>

<tbody>

<tr>
<td>BK001</td>
<td>21 Aug 2026</td>
<td>2.4 MB</td>
<td>180</td>
<td>4 sec</td>
<td><span class="badge safe">SUCCESS</span></td>
</tr>

<tr>
<td>BK002</td>
<td>20 Aug 2026</td>
<td>2.3 MB</td>
<td>170</td>
<td>4 sec</td>
<td><span class="badge safe">SUCCESS</span></td>
</tr>

</tbody>

</table>

</section>

</main>

</body>
</html>
