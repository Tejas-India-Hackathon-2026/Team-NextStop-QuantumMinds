<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFlow-AI | Access Control</title>

<link rel="stylesheet" href="style10.css">

</head>

<body>

<main class="main">

<header class="header">

<div>
<h1>Access Control</h1>
<p>Admin and security permissions</p>
</div>

<div class="avatar">AC</div>

</header>

<section class="panel factors">

<div class="panel-title">
<h2>System Access</h2>
<p>Authorized SecureFlow-AI users</p>
</div>

<table>

<thead>

<tr>
<th>User</th>
<th>Role</th>
<th>Dashboard</th>
<th>Transactions</th>
<th>Reports</th>
<th>Status</th>
</tr>

</thead>

<tbody>

<tr>
<td>Admin</td>
<td>Administrator</td>
<td>Full</td>
<td>Full</td>
<td>Full</td>
<td><span class="badge safe">ACTIVE</span></td>
</tr>

<tr>
<td>Analyst</td>
<td>Security Analyst</td>
<td>View</td>
<td>Review</td>
<td>View</td>
<td><span class="badge safe">ACTIVE</span></td>
</tr>

<tr>
<td>Viewer</td>
<td>Read Only</td>
<td>View</td>
<td>View</td>
<td>View</td>
<td><span class="badge review">LIMITED</span></td>
</tr>

</tbody>

</table>

</section>

</main>

</body>
</html>
