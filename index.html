<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureFlow-AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff;color:#111827}
.sidebar{position:fixed;width:220px;height:100vh;background:#fafafa;border-right:1px solid #eee;padding:30px}
.logo{font-size:20px;font-weight:bold;margin-bottom:45px}
nav a{display:block;padding:13px;color:#6b7280;text-decoration:none}
nav a.active,nav a:hover{color:#111;font-weight:bold}
.main{margin-left:220px;padding:35px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
.card{padding:25px;border:1px solid #eee}
.card h2{margin-top:8px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}
.panel{border:1px solid #eee;overflow:hidden}
.panel h2{padding:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:15px;border-bottom:1px solid #eee}
th{font-size:11px;color:#6b7280}
</style>
</head>

<body>

<aside class="sidebar">
<div class="logo">SecureFlow</div>
<nav>
<a class="active" href="#">Dashboard</a>
<a href="#">Transactions</a>
<a href="#">Risk</a>
<a href="#">Users</a>
<a href="#">Reports</a>
</nav>
</aside>

<main class="main">

<h1>Dashboard</h1>
<p style="color:#6b7280">UPI Fraud Detection</p>

<section class="stats">
<div class="card">Transactions<h2>40</h2></div>
<div class="card">High Risk<h2>8</h2></div>
<div class="card">Safe<h2>27</h2></div>
<div class="card">Review<h2>5</h2></div>
</section>

<section class="grid">

<div class="panel">
<h2>Transactions</h2>
<table>
<tr><th>ID</th><th>Sender</th><th>Amount</th><th>Status</th></tr>
<tr><td>TXN10001</td><td>Soumadip Das</td><td>₹12,500</td><td>High Risk</td></tr>
<tr><td>TXN10002</td><td>Shubham Paul</td><td>₹2,000</td><td>Safe</td></tr>
<tr><td>TXN10003</td><td>Tridip Debroy</td><td>₹35,000</td><td>High Risk</td></tr>
</table>
</div>

<div class="panel">
<h2>Risk</h2>
<div style="text-align:center;padding:50px;font-size:60px">
62%
</div>
</div>

</section>

</main>
</body>
</html>
