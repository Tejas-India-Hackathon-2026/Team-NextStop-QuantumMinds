<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFlow AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .option {
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f8fafc;
        }

        .risk {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡 SecureFlow AI</h1>

    <p style="text-align:center;">
        UPI Fraud Detection Engine
    </p>

    <label>Transaction Amount (₹)</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <div class="option">
        <input type="checkbox" id="unusual_time">
        Unusual Time
    </div>

    <div class="option">
        <input type="checkbox" id="unusual_frequency">
        Unusual Frequency
    </div>

    <div class="option">
        <input type="checkbox" id="new_device">
        New Device
    </div>

    <div class="option">
        <input type="checkbox" id="unusual_location">
        Unusual Location
    </div>

    <div class="option">
        <input type="checkbox" id="sudden_location_change">
        Sudden Location Change
    </div>

    <div class="option">
        <input type="checkbox" id="unknown_beneficiary">
        Unknown Beneficiary
    </div>

    <div class="option">
        <input type="checkbox" id="no_previous_transactions">
        No Previous Transactions
    </div>

    <div class="option">
        <input type="checkbox" id="unusual_beneficiary_amount">
        Unusual Beneficiary Amount
    </div>

    <button onclick="analyzeTransaction()">
        Analyze Transaction
    </button>

    <div id="result"></div>

</div>

<script>

async function analyzeTransaction() {

    const data = {
        amount: parseFloat(document.getElementById("amount").value),

        unusual_time:
            document.getElementById("unusual_time").checked,

        unusual_frequency:
            document.getElementById("unusual_frequency").checked,

        new_device:
            document.getElementById("new_device").checked,

        unusual_location:
            document.getElementById("unusual_location").checked,

        sudden_location_change:
            document.getElementById("sudden_location_change").checked,

        unknown_beneficiary:
            document.getElementById("unknown_beneficiary").checked,

        no_previous_transactions:
            document.getElementById("no_previous_transactions").checked,

        unusual_beneficiary_amount:
            document.getElementById("unusual_beneficiary_amount").checked
    };

    const response = await fetch("http://127.0.0.1:8000/transaction", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    let reasons = result.reasons
        .map(reason => `<li>${reason}</li>`)
        .join("");

    let questions = result.ai_questions
        .map(question => `<li>${question}</li>`)
        .join("");

    document.getElementById("result").innerHTML = `
        <div class="risk">
            Risk Score: ${result.risk_score}
        </div>

        <h3>Decision: ${result.decision}</h3>

        <h3>Reasons</h3>
        <ul>${reasons}</ul>

        <h3>AI Questions</h3>
        <ul>${questions}</ul>
    `;
}

</script>

</body>
</html>
