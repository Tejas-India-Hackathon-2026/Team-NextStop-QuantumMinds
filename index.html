<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>AI Fraud Detection</title>

<style>

body {
    background: #020617;
    color: white;
    font-family: Arial;
    margin: 0;
}

header {
    padding: 25px;
    background: #0f172a;
    text-align: center;
}

.dashboard {
    max-width: 1000px;
    margin: 40px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
}

input[type="number"] {
    width: 100%;
    padding: 15px;
    box-sizing: border-box;
    margin: 15px 0;
    background: #1e293b;
    color: white;
    border: 1px solid #475569;
    border-radius: 8px;
}

label {
    display: block;
    padding: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

.score {
    text-align: center;
    font-size: 50px;
    font-weight: bold;
    padding: 30px;
}

#decision {
    text-align: center;
    font-size: 25px;
    padding: 15px;
}

</style>

</head>

<body>

<header>

<h1>🤖 SecureFlow AI</h1>

<p>Real-Time UPI Fraud Detection System</p>

</header>

<div class="dashboard">

<div class="panel">

<h2>Transaction Analysis</h2>

<input
type="number"
id="amount"
placeholder="Transaction Amount">

<label>
<input type="checkbox" id="unusual_time">
Unusual Time
</label>

<label>
<input type="checkbox" id="unusual_frequency">
Unusual Frequency
</label>

<label>
<input type="checkbox" id="new_device">
New Device
</label>

<label>
<input type="checkbox" id="unusual_location">
Unusual Location
</label>

<label>
<input type="checkbox" id="sudden_location_change">
Sudden Location Change
</label>

<label>
<input type="checkbox" id="unknown_beneficiary">
Unknown Beneficiary
</label>

<label>
<input type="checkbox" id="no_previous_transactions">
No Previous Transactions
</label>

<label>
<input type="checkbox" id="unusual_beneficiary_amount">
Unusual Beneficiary Amount
</label>

<button onclick="analyze()">
RUN AI ANALYSIS
</button>

</div>

<div class="panel">

<h2>AI Security Result</h2>

<div class="score" id="score">
--
</div>

<div id="decision">
Waiting for transaction...
</div>

<h3>Detected Threats</h3>

<ul id="reasons"></ul>

<h3>AI Questions</h3>

<ul id="questions"></ul>

</div>

</div>

<script>

async function analyze() {

    const ids = [
        "unusual_time",
        "unusual_frequency",
        "new_device",
        "unusual_location",
        "sudden_location_change",
        "unknown_beneficiary",
        "no_previous_transactions",
        "unusual_beneficiary_amount"
    ];

    const data = {
        amount: Number(document.getElementById("amount").value)
    };

    ids.forEach(id => {
        data[id] = document.getElementById(id).checked;
    });

    const response = await fetch(
        "http://127.0.0.1:8000/transaction",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }
    );

    const result = await response.json();

    document.getElementById("score").innerText =
        result.risk_score;

    document.getElementById("decision").innerText =
        result.decision;

    document.getElementById("reasons").innerHTML =
        result.reasons
        .map(x => `<li>${x}</li>`)
        .join("");

    document.getElementById("questions").innerHTML =
        result.ai_questions
        .map(x => `<li>${x}</li>`)
        .join("");
}

</script>

</body>
</html>
