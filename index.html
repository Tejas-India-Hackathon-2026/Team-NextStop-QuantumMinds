<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Alert Center</title>

<style>
body{
margin:0;
font-family:Arial;
background:#fef2f2;
}

header{
background:#991b1b;
color:white;
padding:25px;
text-align:center;
}

.container{
max-width:800px;
margin:30px auto;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #fecaca;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#dc2626;
color:white;
border:0;
border-radius:8px;
}

.alert{
margin-top:20px;
padding:20px;
background:#fee2e2;
border-left:6px solid #dc2626;
}

</style>
</head>

<body>

<header>
<h1>🚨 UPI Fraud Alert Center</h1>
<p>Real-Time Transaction Threat Detection</p>
</header>

<div class="container">

<div class="card">

<h2>Analyze UPI Payment</h2>

<input id="amount" type="number" placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Suspicious Time</label>
<label><input id="unusual_frequency" type="checkbox"> Suspicious Frequency</label>
<label><input id="new_device" type="checkbox"> Unknown Device</label>
<label><input id="unusual_location" type="checkbox"> Unknown Location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Receiver</label>
<label><input id="no_previous_transactions" type="checkbox"> No Transaction History</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Suspicious Amount</label>

<button onclick="check()">CHECK FOR FRAUD</button>

<div class="alert">

<h2 id="decision">No Alert</h2>

<h3 id="score">Risk Score: --</h3>

<div id="reasons"></div>

</div>

</div>
</div>

<script>
async function check(){

let ids=[
"unusual_time","unusual_frequency","new_device",
"unusual_location","sudden_location_change",
"unknown_beneficiary","no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let r=await response.json();

document.getElementById("decision").innerText=r.decision;

document.getElementById("score").innerText=
"Risk Score: "+r.risk_score;

document.getElementById("reasons").innerHTML=
r.reasons.map(x=>`<p>🚨 ${x}</p>`).join("");
}
</script>

</body>
</html>
