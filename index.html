<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Fraud Analyst</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e0f2fe;
}

.chat{
width:700px;
max-width:94%;
margin:30px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px #94a3b8;
}

.header{
background:#0369a1;
color:white;
padding:25px;
}

.chatbox{
padding:25px;
min-height:350px;
}

.bot{
background:#e0f2fe;
padding:15px;
border-radius:12px;
margin:10px 0;
}

.controls{
padding:20px;
border-top:1px solid #ddd;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:6px;
}

button{
width:100%;
padding:15px;
background:#0369a1;
color:white;
border:0;
border-radius:8px;
}
</style>
</head>

<body>

<div class="chat">

<div class="header">
<h2>🤖 SecureFlow AI Analyst</h2>
<p>UPI Fraud Investigation Assistant</p>
</div>

<div class="chatbox" id="chat">

<div class="bot">
Hello! I am SecureFlow AI. Submit a UPI transaction and I will investigate it.
</div>

</div>

<div class="controls">

<input id="amount" type="number" placeholder="Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="investigate()">ASK AI TO INVESTIGATE</button>

</div>

</div>

<script>
async function investigate(){

let ids=[
"unusual_time","unusual_frequency","new_device",
"unusual_location","sudden_location_change",
"unknown_beneficiary","no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let r=await response.json();

let html=`
<div class="bot">
<b>Risk Score:</b> ${r.risk_score}<br>
<b>Decision:</b> ${r.decision}
</div>
`;

r.reasons.forEach(x=>{
html+=`<div class="bot">⚠ ${x}</div>`;
});

r.ai_questions.forEach(x=>{
html+=`<div class="bot">🤖 ${x}</div>`;
});

document.getElementById("chat").innerHTML+=html;
}
</script>

</body>
</html>
