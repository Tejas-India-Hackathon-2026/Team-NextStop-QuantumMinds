<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFlow Banking</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.header {
    background: #0f172a;
    color: white;
    padding: 20px;
    text-align: center;
}

.card {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.amount {
    font-size: 35px;
    text-align: center;
    margin-bottom: 25px;
}

.amount input {
    width: 90%;
    padding: 15px;
    font-size: 20px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
}

.security {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.security label {
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    cursor: pointer;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #ecfdf5;
}

</style>
</head>

<body>

<div class="header">
    <h1>SecureFlow AI</h1>
    <p>Secure UPI Transaction Verification</p>
</div>

<div class="card">

    <div class="amount">
        <input
            type="number"
            id="amount"
            placeholder="₹ Enter Amount">
    </div>

    <div class="security">

        <label>
            <input type="checkbox" id="unusual_time">
            Unusual Time
        </label>

        <label>
            <input type="checkbox" id="unusual_frequency">
            Unusual Frequency
        </label>

        <label>
            <input type="checkbox" id="new_device">
            New Device
        </label>

        <label>
            <input type="checkbox" id="unusual_location">
            Unusual Location
        </label>

        <label>
            <input type="checkbox" id="sudden_location_change">
            Location Change
        </label>

        <label>
            <input type="checkbox" id="unknown_beneficiary">
            Unknown Recipient
        </label>

        <label>
            <input type="checkbox" id="no_previous_transactions">
            First Transaction
        </label>

        <label>
            <input type="checkbox" id="unusual_beneficiary_amount">
            Unusual Amount
        </label>

    </div>

    <button onclick="checkTransaction()">
        🔐 Verify Payment
    </button>

    <div class="result" id="result">
        Transaction analysis will appear here.
    </div>

</div>

<script>

async function checkTransaction() {

    const fields = [
        "unusual_time",
        "unusual_frequency",
        "new_device",
        "unusual_location",
        "sudden_location_change",
        "unknown_beneficiary",
        "no_previous_transactions",
        "unusual_beneficiary_amount"
    ];

    let data = {
        amount: Number(document.getElementById("amount").value)
    };

    fields.forEach(field => {
        data[field] = document.getElementById(field).checked;
    });

    const response = await fetch(
        "http://127.0.0.1:8000/transaction",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }
    );

    const result = await response.json();

    document.getElementById("result").innerHTML = `
        <h2>Risk Score: ${result.risk_score}</h2>

        <h2>Decision: ${result.decision}</h2>

        <h3>Security Reasons</h3>
        <ul>
            ${result.reasons.map(r => `<li>${r}</li>`).join("")}
        </ul>

        <h3>AI Verification Questions</h3>
        <ul>
            ${result.ai_questions.map(q => `<li>${q}</li>`).join("")}
        </ul>
    `;
}

</script>

</body>
</html>
