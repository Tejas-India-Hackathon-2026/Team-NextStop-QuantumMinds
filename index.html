<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPI Verify</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f8fafc;
}

.nav{
background:#2563eb;
color:white;
padding:20px;
}

.container{
width:500px;
max-width:90%;
margin:40px auto;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 25px #cbd5e1;
}

.amount{
font-size:40px;
text-align:center;
font-weight:bold;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:0;
border-radius:10px;
margin-top:15px;
}

.result{
text-align:center;
margin-top:25px;
}

</style>
</head>

<body>

<div class="nav">
<h2>SecureFlow-AI</h2>
</div>

<div class="container">

<div class="card">

<h2>Verify UPI Payment</h2>

<div class="amount">
₹ <span id="amountDisplay">0</span>
</div>

<input id="amount" type="number"
placeholder="Enter amount"
oninput="amountDisplay.innerText=this.value">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="verify()">VERIFY PAYMENT</button>

<div class="result">

<h2 id="decision">Waiting for verification</h2>
<h3 id="score"></h3>

</div>

</div>
</div>

<script>
async function verify(){

let ids=[
"unusual_time","unusual_frequency","new_device",
"unusual_location","sudden_location_change",
"unknown_beneficiary","no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let r=await response.json();

document.getElementById("decision").innerText=r.decision;

document.getElementById("score").innerText=
"Risk Score: "+r.risk_score;
}
</script>

</body>
</html>
