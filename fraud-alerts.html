<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFlow-AI | Alert Severity</title>

<link rel="stylesheet" href="style10.css">

</head>

<body>

<main class="main">

<header class="header">

<div>

<h1>Alert Severity Dashboard</h1>

<p>Fraud alerts classified according to severity</p>

</div>

</header>


<section class="stats">

<div class="stat">

<div class="stat-title">
CRITICAL
</div>

<div class="stat-number red">
07
</div>

</div>


<div class="stat">

<div class="stat-title">
HIGH
</div>

<div class="stat-number orange">
05
</div>

</div>


<div class="stat">

<div class="stat-title">
MEDIUM
</div>

<div class="stat-number blue">
08
</div>

</div>


<div class="stat">

<div class="stat-title">
LOW
</div>

<div class="stat-number green">
22
</div>

</div>

</section>


<section class="panel factors">

<div class="panel-title">

<h2>Severity Distribution</h2>

<p>Classification of security alerts</p>

</div>


<div class="factor-grid">


<div class="factor">

<h3>Critical</h3>

<p>07 alerts</p>

<div class="progress">

<div style="width:85%"></div>

</div>

</div>


<div class="factor">

<h3>High</h3>

<p>05 alerts</p>

<div class="progress">

<div style="width:65%"></div>

</div>

</div>


<div class="factor">

<h3>Medium</h3>

<p>08 alerts</p>

<div class="progress">

<div style="width:45%"></div>

</div>

</div>


<div class="factor">

<h3>Low</h3>

<p>22 alerts</p>

<div class="progress">

<div style="width:25%"></div>

</div>

</div>


</div>

</section>

</main>

</body>

</html>
