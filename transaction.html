<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureFlow Assistant</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e0f2fe;
}

.chat{
width:650px;
max-width:94%;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px #94a3b8;
}

.header{
background:#0369a1;
color:white;
padding:25px;
}

.messages{
padding:25px;
min-height:400px;
}

.bot{
background:#e0f2fe;
padding:15px;
border-radius:15px;
margin:10px 0;
}

.user{
background:#0369a1;
color:white;
padding:15px;
border-radius:15px;
margin:10px 0 10px auto;
width:70%;
}

.controls{
padding:20px;
border-top:1px solid #ddd;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:6px;
}

button{
width:100%;
padding:15px;
background:#0369a1;
color:white;
border:0;
border-radius:8px;
}
</style>
</head>

<body>

<div class="chat">

<div class="header">
<h2>🤖 SecureFlow Assistant</h2>
<p>AI Transaction Verification</p>
</div>

<div class="messages" id="messages">

<div class="bot">
Hello! I am SecureFlow AI. I will check this transaction for suspicious activity.
</div>

</div>

<div class="controls">

<input id="amount" type="number" placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> First Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="chat()">START AI INTERVIEW</button>

</div>

</div>

<script>
async function chat(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const response=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

let html=`
<div class="user">
Transaction submitted for verification.
</div>

<div class="bot">
<b>Risk Score:</b> ${r.risk_score}<br>
<b>Decision:</b> ${r.decision}
</div>
`;

r.ai_questions.forEach(q=>{
html+=`<div class="bot">🤖 ${q}</div>`;
});

document.getElementById("messages").innerHTML+=html;
}
</script>

</body>
</html>
