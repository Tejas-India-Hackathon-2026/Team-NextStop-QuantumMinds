<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureFlow AI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2ff;
}
header{
    background:#312e81;
    color:white;
    padding:25px;
    text-align:center;
}
.container{
    width:900px;
    max-width:90%;
    margin:30px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #c7d2fe;
}
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
}
label{
    display:block;
    padding:7px;
}
button{
    width:100%;
    padding:15px;
    background:#312e81;
    color:white;
    border:0;
    border-radius:8px;
    margin-top:15px;
}
.score{
    font-size:60px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🛡 SecureFlow-AI</h1>
<p>UPI Fraud Detection & Risk Analysis</p>
</header>

<div class="container">

<div class="card">
<h2>Transaction Details</h2>

<input id="amount" type="number" placeholder="Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual transaction time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual frequency</label>
<label><input id="new_device" type="checkbox"> New device</label>
<label><input id="unusual_location" type="checkbox"> Unusual location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden location change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No previous transactions</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual beneficiary amount</label>

<button onclick="analyze()">ANALYZE TRANSACTION</button>
</div>

<div class="card">
<h2>AI Risk Result</h2>

<div class="score" id="score">--</div>

<h2 id="decision" style="text-align:center">
WAITING
</h2>

<h3>Detected Reasons</h3>
<div id="reasons"></div>

<h3>AI Questions</h3>
<div id="questions"></div>

</div>

</div>

<script>
async function analyze(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

const result=await response.json();

document.getElementById("score").innerText=result.risk_score;
document.getElementById("decision").innerText=result.decision;

document.getElementById("reasons").innerHTML=
result.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");

document.getElementById("questions").innerHTML=
result.ai_questions.map(x=>`<p>🤖 ${x}</p>`).join("");
}
</script>

</body>
</html>
