<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureFlow Command Center</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.top{
padding:25px;
background:#020617;
}

.grid{
max-width:1000px;
margin:30px auto;
display:grid;
grid-template-columns:250px 1fr;
gap:20px;
}

.menu{
background:#1e293b;
padding:20px;
border-radius:15px;
}

.menu p{
padding:15px;
border-bottom:1px solid #334155;
}

.main{
background:#1e293b;
padding:30px;
border-radius:15px;
}

input[type=number]{
width:100%;
padding:15px;
background:#0f172a;
color:white;
border:1px solid #475569;
box-sizing:border-box;
}

label{
display:inline-block;
width:48%;
padding:12px 0;
}

button{
width:100%;
padding:15px;
background:#14b8a6;
color:white;
border:0;
border-radius:8px;
}

.score{
font-size:60px;
text-align:center;
}
</style>
</head>

<body>

<div class="top">
<h1>🎛 SecureFlow Command Center</h1>
</div>

<div class="grid">

<div class="menu">
<h3>CONTROL PANEL</h3>
<p>Overview</p>
<p>Fraud Detection</p>
<p>Transactions</p>
<p>Risk Engine</p>
<p>AI Questions</p>
</div>

<div class="main">

<h2>Transaction Risk Engine</h2>

<input id="amount" type="number" placeholder="Transaction Amount">

<label><input id="unusual_time" type="checkbox"> Time</label>
<label><input id="unusual_frequency" type="checkbox"> Frequency</label>
<label><input id="new_device" type="checkbox"> Device</label>
<label><input id="unusual_location" type="checkbox"> Location</label>
<label><input id="sudden_location_change" type="checkbox"> Movement</label>
<label><input id="unknown_beneficiary" type="checkbox"> Recipient</label>
<label><input id="no_previous_transactions" type="checkbox"> History</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Amount</label>

<button onclick="runEngine()">EXECUTE RISK ENGINE</button>

<div class="score" id="score">--</div>

<h2 id="decision">ENGINE IDLE</h2>

<ul id="reasons"></ul>

</div>
</div>

<script>
async function runEngine(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const r=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const x=await r.json();

document.getElementById("score").innerText=x.risk_score;
document.getElementById("decision").innerText=x.decision;
document.getElementById("reasons").innerHTML=x.reasons.map(a=>`<li>${a}</li>`).join("");
}
</script>

</body>
</html>
