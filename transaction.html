<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Payment Card</title>

<style>
body{
margin:0;
background:#dbeafe;
font-family:Arial;
}

.card{
width:650px;
max-width:90%;
margin:50px auto;
}

.bankcard{
height:230px;
background:linear-gradient(135deg,#111827,#1e3a8a);
color:white;
border-radius:20px;
padding:30px;
box-shadow:0 15px 30px #94a3b8;
}

.chip{
width:50px;
height:35px;
background:#fbbf24;
border-radius:7px;
}

.amount{
font-size:35px;
margin-top:35px;
}

.panel{
margin-top:25px;
background:white;
padding:25px;
border-radius:15px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
}

button{
width:100%;
padding:15px;
background:#1e3a8a;
color:white;
border:0;
margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<div class="bankcard">

<div class="chip"></div>

<h2>SECUREFLOW AI</h2>

<div class="amount" id="display">₹ 0</div>

</div>

<div class="panel">

<h2>Security Verification</h2>

<input id="amount" type="number" placeholder="Enter amount"
oninput="display.innerText='₹ '+this.value">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> No Previous Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="verify()">VERIFY TRANSACTION</button>

<h2 id="result">Waiting...</h2>

</div>
</div>

<script>
async function verify(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const r=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const x=await r.json();

document.getElementById("result").innerText=
x.decision+" | Risk Score: "+x.risk_score;
}
</script>

</body>
</html>
