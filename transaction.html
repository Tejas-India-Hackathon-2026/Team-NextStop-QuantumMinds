<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SecureFlow Control Room</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#0b1120;
color:#e2e8f0;
}

header{
background:#111827;
padding:20px 35px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #334155;
}

.online{
color:#22c55e;
}

.dashboard{
max-width:1200px;
margin:30px auto;
padding:20px;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.panel{
background:#111827;
border:1px solid #334155;
border-radius:15px;
padding:25px;
}

input[type=number]{
width:100%;
padding:15px;
background:#020617;
color:white;
border:1px solid #475569;
border-radius:8px;
}

.signals{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.signal{
background:#1e293b;
padding:15px;
border-radius:8px;
}

button{
width:100%;
padding:16px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
margin-top:20px;
}

.riskbox{
text-align:center;
padding:25px;
border:1px solid #475569;
border-radius:15px;
}

.score{
font-size:75px;
font-weight:bold;
}

.decision{
font-size:25px;
padding:15px;
background:#1e293b;
border-radius:10px;
}

.log{
margin-top:20px;
background:#020617;
padding:15px;
border-radius:8px;
font-family:monospace;
min-height:150px;
}

@media(max-width:800px){

.dashboard{
grid-template-columns:1fr;
}

.signals{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<div>
<h2>🛡 SECUREFLOW AI</h2>
</div>

<div class="online">
● FRAUD ENGINE ONLINE
</div>

</header>

<div class="dashboard">

<div class="panel">

<h2>Transaction Control</h2>

<input
id="amount"
type="number"
placeholder="Enter transaction amount ₹">

<div class="signals">

<div class="signal">
<input id="unusual_time" type="checkbox">
Unusual Time
</div>

<div class="signal">
<input id="unusual_frequency" type="checkbox">
Unusual Frequency
</div>

<div class="signal">
<input id="new_device" type="checkbox">
New Device
</div>

<div class="signal">
<input id="unusual_location" type="checkbox">
Unusual Location
</div>

<div class="signal">
<input id="sudden_location_change" type="checkbox">
Location Change
</div>

<div class="signal">
<input id="unknown_beneficiary" type="checkbox">
Unknown Beneficiary
</div>

<div class="signal">
<input id="no_previous_transactions" type="checkbox">
No Previous Transaction
</div>

<div class="signal">
<input id="unusual_beneficiary_amount" type="checkbox">
Unusual Amount
</div>

</div>

<button onclick="run()">
RUN FRAUD DETECTION ENGINE
</button>

</div>

<div class="panel">

<h2>Live Risk Monitor</h2>

<div class="riskbox">

<div class="score" id="score">--</div>

<div class="decision" id="decision">
WAITING
</div>

</div>

<h3>Detection Log</h3>

<div class="log" id="log">
SYSTEM READY...<br>
Waiting for transaction...
</div>

</div>

</div>

<script>

async function run(){

const ids=[
"unusual_time",
"unusual_frequency",
"new_device",
"unusual_location",
"sudden_location_change",
"unknown_beneficiary",
"no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

document.getElementById("log").innerHTML=
"CONNECTING TO AI ENGINE...<br>";

try{

const response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

const r=await response.json();

document.getElementById("score")
.innerText=r.risk_score;

document.getElementById("decision")
.innerText=r.decision;

let log="ANALYSIS COMPLETE...<br>";
log+="RISK SCORE: "+r.risk_score+"<br>";
log+="DECISION: "+r.decision+"<br><br>";

r.reasons.forEach(x=>{
log+="⚠ "+x+"<br>";
});

document.getElementById("log").innerHTML=log;

}catch(error){

document.getElementById("log").innerHTML=
"❌ ERROR: FastAPI backend unavailable.";

}

}

</script>

</body>
</html>
