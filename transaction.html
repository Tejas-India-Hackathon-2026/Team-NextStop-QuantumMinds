<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPI Security Scanner</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
}

.scanner{
width:650px;
max-width:90%;
margin:50px auto;
text-align:center;
}

.circle{
width:220px;
height:220px;
border:8px solid #22c55e;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.panel{
margin-top:30px;
background:#111827;
padding:25px;
border-radius:20px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
text-align:left;
padding:7px;
}

button{
width:100%;
padding:15px;
background:#22c55e;
border:0;
border-radius:8px;
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>

<div class="scanner">

<h1>🔐 UPI Security Scanner</h1>
<p>SecureFlow-AI Transaction Verification</p>

<div class="circle">
<span id="score">0</span>
</div>

<h2 id="decision">SYSTEM READY</h2>

<div class="panel">

<input id="amount" type="number" placeholder="Enter UPI Amount">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> High Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Sudden Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> First Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="scan()">SCAN PAYMENT</button>

<div id="result"></div>

</div>
</div>

<script>
async function scan(){

let ids=[
"unusual_time","unusual_frequency","new_device",
"unusual_location","sudden_location_change",
"unknown_beneficiary","no_previous_transactions",
"unusual_beneficiary_amount"
];

let data={
amount:Number(document.getElementById("amount").value)
};

ids.forEach(id=>{
data[id]=document.getElementById(id).checked;
});

let response=await fetch(
"http://127.0.0.1:8000/transaction",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let r=await response.json();

document.getElementById("score").innerText=r.risk_score;
document.getElementById("decision").innerText=r.decision;

document.getElementById("result").innerHTML=
r.reasons.map(x=>`<p>⚠ ${x}</p>`).join("");
}
</script>

</body>
</html>
