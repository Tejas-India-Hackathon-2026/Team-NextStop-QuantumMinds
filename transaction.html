<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security Shield</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(#020617,#172554);
color:white;
text-align:center;
}

.container{
width:650px;
max-width:90%;
margin:50px auto;
}

.shield{
width:180px;
height:210px;
margin:auto;
background:#2563eb;
clip-path:polygon(50% 0,90% 15%,85% 70%,50% 100%,15% 70%,10% 15%);
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.panel{
margin-top:30px;
background:#ffffff15;
padding:30px;
border-radius:20px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
text-align:left;
}

button{
width:100%;
padding:15px;
background:#22c55e;
border:0;
border-radius:8px;
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="shield">🛡️</div>

<h1>SecureFlow Protection</h1>
<p>AI Payment Security Shield</p>

<div class="panel">

<input id="amount" type="number" placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Time anomaly</label>
<label><input id="unusual_frequency" type="checkbox"> Frequency anomaly</label>
<label><input id="new_device" type="checkbox"> New device</label>
<label><input id="unusual_location" type="checkbox"> Location anomaly</label>
<label><input id="sudden_location_change" type="checkbox"> Location change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown recipient</label>
<label><input id="no_previous_transactions" type="checkbox"> First transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Amount anomaly</label>

<button onclick="protect()">ACTIVATE AI PROTECTION</button>

<h1 id="score">--</h1>
<h2 id="decision">Shield Ready</h2>

<div id="result"></div>

</div>
</div>

<script>
async function protect(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const r=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const x=await r.json();

document.getElementById("score").innerText="Risk "+x.risk_score;
document.getElementById("decision").innerText=x.decision;

document.getElementById("result").innerHTML=
x.reasons.map(a=>`<p>⚠ ${a}</p>`).join("");
}
</script>
</body>
</html>
