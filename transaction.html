<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Investigation</title>

<style>
body{
margin:0;
font-family:monospace;
background:#111;
color:#ddd;
}

header{
background:#222;
padding:20px;
border-bottom:2px solid #777;
}

.container{
max-width:1000px;
margin:30px auto;
padding:20px;
}

.case{
background:#1b1b1b;
border:1px solid #555;
padding:25px;
}

input[type=number]{
background:#111;
color:white;
border:1px solid #777;
padding:15px;
width:100%;
box-sizing:border-box;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
padding:15px;
border:1px solid #444;
}

button{
padding:15px;
width:100%;
background:#444;
color:white;
border:1px solid #aaa;
margin-top:20px;
}

#result{
margin-top:25px;
}
</style>
</head>

<body>

<header>
<h1>SECUREFLOW // FRAUD INVESTIGATION CONSOLE</h1>
</header>

<div class="container">

<div class="case">

<h2>CASE #SF-001</h2>

<input id="amount" type="number" placeholder="Transaction Amount">

<table>

<tr>
<th>Security Indicator</th>
<th>Detected</th>
</tr>

<tr>
<td>Unusual Time</td>
<td><input id="unusual_time" type="checkbox"></td>
</tr>

<tr>
<td>Unusual Frequency</td>
<td><input id="unusual_frequency" type="checkbox"></td>
</tr>

<tr>
<td>New Device</td>
<td><input id="new_device" type="checkbox"></td>
</tr>

<tr>
<td>Unusual Location</td>
<td><input id="unusual_location" type="checkbox"></td>
</tr>

<tr>
<td>Sudden Location Change</td>
<td><input id="sudden_location_change" type="checkbox"></td>
</tr>

<tr>
<td>Unknown Beneficiary</td>
<td><input id="unknown_beneficiary" type="checkbox"></td>
</tr>

<tr>
<td>No Previous Transaction</td>
<td><input id="no_previous_transactions" type="checkbox"></td>
</tr>

<tr>
<td>Unusual Beneficiary Amount</td>
<td><input id="unusual_beneficiary_amount" type="checkbox"></td>
</tr>

</table>

<button onclick="investigate()">START INVESTIGATION</button>

<div id="result"></div>

</div>
</div>

<script>
async function investigate(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const response=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.getElementById("result").innerHTML=`
<h2>RISK SCORE: ${r.risk_score}</h2>
<h2>DECISION: ${r.decision}</h2>
<h3>Evidence</h3>
${r.reasons.map(x=>`<p>→ ${x}</p>`).join("")}
`;
}
</script>

</body>
</html>
