<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Traffic Monitor</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f1f5f9;
}

.container{
width:650px;
max-width:90%;
margin:40px auto;
text-align:center;
}

.traffic{
background:#111827;
width:150px;
padding:20px;
margin:auto;
border-radius:25px;
}

.light{
width:75px;
height:75px;
border-radius:50%;
margin:15px auto;
background:#374151;
}

.red{background:#ef4444}
.yellow{background:#facc15}
.green{background:#22c55e}

.panel{
margin-top:30px;
background:white;
padding:25px;
border-radius:15px;
}

input[type=number]{
width:100%;
padding:15px;
box-sizing:border-box;
}

label{
display:block;
padding:8px;
text-align:left;
}

button{
width:100%;
padding:15px;
background:#111827;
color:white;
border:0;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚦 SecureFlow Risk Monitor</h1>

<div class="traffic">

<div class="light" id="red"></div>
<div class="light" id="yellow"></div>
<div class="light" id="green"></div>

</div>

<div class="panel">

<input id="amount" type="number" placeholder="Transaction Amount ₹">

<label><input id="unusual_time" type="checkbox"> Unusual Time</label>
<label><input id="unusual_frequency" type="checkbox"> Unusual Frequency</label>
<label><input id="new_device" type="checkbox"> New Device</label>
<label><input id="unusual_location" type="checkbox"> Unusual Location</label>
<label><input id="sudden_location_change" type="checkbox"> Location Change</label>
<label><input id="unknown_beneficiary" type="checkbox"> Unknown Beneficiary</label>
<label><input id="no_previous_transactions" type="checkbox"> First Transaction</label>
<label><input id="unusual_beneficiary_amount" type="checkbox"> Unusual Amount</label>

<button onclick="monitor()">CHECK TRAFFIC SIGNAL</button>

<h2 id="decision">SYSTEM READY</h2>
<h3 id="score"></h3>

</div>
</div>

<script>
async function monitor(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const response=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r=await response.json();

document.querySelectorAll(".light").forEach(x=>x.className="light");

if(r.decision==="BLOCK"){
document.getElementById("red").classList.add("red");
}
else if(r.decision==="VERIFY"){
document.getElementById("yellow").classList.add("yellow");
}
else{
document.getElementById("green").classList.add("green");
}

document.getElementById("decision").innerText=r.decision;
document.getElementById("score").innerText="Risk Score: "+r.risk_score;
}
</script>

</body>
</html>
