<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Passport</title>

<style>
body{
margin:0;
background:#e5e7eb;
font-family:Arial;
}

.passport{
width:700px;
max-width:90%;
margin:50px auto;
background:#172554;
color:white;
padding:35px;
border-radius:15px;
}

.page{
background:#f8fafc;
color:#111827;
padding:25px;
border-radius:10px;
}

.field{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #ddd;
}

input[type=number]{
padding:12px;
width:100%;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
background:#172554;
color:white;
border:0;
}

</style>
</head>

<body>

<div class="passport">

<h1>🛂 Transaction Passport</h1>
<p>SecureFlow AI Verification Document</p>

<div class="page">

<input id="amount" type="number" placeholder="Amount ₹">

<div class="field">
<span>Unusual Time</span>
<input id="unusual_time" type="checkbox">
</div>

<div class="field">
<span>Unusual Frequency</span>
<input id="unusual_frequency" type="checkbox">
</div>

<div class="field">
<span>New Device</span>
<input id="new_device" type="checkbox">
</div>

<div class="field">
<span>Unusual Location</span>
<input id="unusual_location" type="checkbox">
</div>

<div class="field">
<span>Location Change</span>
<input id="sudden_location_change" type="checkbox">
</div>

<div class="field">
<span>Unknown Beneficiary</span>
<input id="unknown_beneficiary" type="checkbox">
</div>

<div class="field">
<span>No Previous Transaction</span>
<input id="no_previous_transactions" type="checkbox">
</div>

<div class="field">
<span>Unusual Amount</span>
<input id="unusual_beneficiary_amount" type="checkbox">
</div>

<button onclick="verify()">VERIFY PASSPORT</button>

<h2 id="decision">NOT VERIFIED</h2>

<p id="score"></p>

<ul id="reasons"></ul>

</div>
</div>

<script>
async function verify(){

const ids=["unusual_time","unusual_frequency","new_device","unusual_location","sudden_location_change","unknown_beneficiary","no_previous_transactions","unusual_beneficiary_amount"];

let data={amount:Number(document.getElementById("amount").value)};
ids.forEach(id=>data[id]=document.getElementById(id).checked);

const r=await fetch("http://127.0.0.1:8000/transaction",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const x=await r.json();

document.getElementById("decision").innerText=x.decision;
document.getElementById("score").innerText="Risk Score: "+x.risk_score;
document.getElementById("reasons").innerHTML=x.reasons.map(a=>`<li>${a}</li>`).join("");
}
</script>

</body>
</html>
